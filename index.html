<!-- PeerJS library for cross-device web connectivity -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<script>
  let peer = null;
  let connections = []; // For Host: holds student peer connections
  let hostConn = null;  // For Student: connection to host

  // Initialize Host Room
  window.createNewOnlineRoom = function() {
    const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
    window.gameState.roomCode = roomCode;
    window.gameState.isHost = true;
    window.gameState.myPlayerName = "Professeur (Hôte)";

    const countEl = document.getElementById('impostor-count-select');
    const impostorCount = countEl ? parseInt(countEl.value, 10) : 1;

    window.gameState.roomData = {
      code: roomCode,
      status: 'LOBBY',
      impostorCount: impostorCount,
      players: [{ id: 'host', name: window.gameState.myPlayerName, isHost: true }]
    };

    // Create a peer ID prefixed with room code for easy student connection
    peer = new Peer('imposteur-room-' + roomCode);

    peer.on('open', (id) => {
      showLobbyUI(roomCode, true);
    });

    peer.on('connection', (conn) => {
      connections.push(conn);
      conn.on('data', (data) => {
        if (data.type === 'JOIN') {
          const newPlayer = { id: conn.peer, name: data.playerName, isHost: false };
          if (!window.gameState.roomData.players.some(p => p.id === conn.peer)) {
            window.gameState.roomData.players.push(newPlayer);
          }
          broadcastRoomState();
        }
      });
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        // Retry with new code if code collision occurs
        createNewOnlineRoom();
      }
    });
  };

  // Broadcast state to all students connected to host
  function broadcastRoomState() {
    connections.forEach(conn => {
      if (conn.open) {
        conn.send({ type: 'SYNC', roomData: window.gameState.roomData });
      }
    });
    syncGameStateFromPeer(window.gameState.roomData);
  }

  // Initialize Student Join
  window.joinRoomByCode = function() {
    const codeInput = document.getElementById('join-code-input').value.trim().toUpperCase();
    const nameInput = document.getElementById('join-name-input').value.trim();

    if (!codeInput || codeInput.length !== 4) {
      alert("Veuillez entrer un code à 4 chiffres valide.");
      return;
    }
    if (!nameInput) {
      alert("Veuillez entrer votre prénom.");
      return;
    }

    window.gameState.roomCode = codeInput;
    window.gameState.isHost = false;
    window.gameState.myPlayerName = nameInput;

    peer = new Peer();

    peer.on('open', () => {
      hostConn = peer.connect('imposteur-room-' + codeInput);

      hostConn.on('open', () => {
        hostConn.send({ type: 'JOIN', playerName: nameInput });
        showLobbyUI(codeInput, false);
      });

      hostConn.on('data', (data) => {
        if (data.type === 'SYNC') {
          syncGameStateFromPeer(data.roomData);
        }
      });

      hostConn.on('error', () => {
        alert("Code de salle introuvable ! Vérifiez le code à 4 chiffres.");
      });
    });
  };

  function syncGameStateFromPeer(data) {
    window.gameState.roomData = data;
    window.gameState.playerNames = data.players.map(p => p.name);

    const countEl = document.getElementById('lobby-player-count');
    if (countEl) countEl.innerText = data.players.length;

    const grid = document.getElementById('lobby-players-grid');
    if (grid) {
      grid.innerHTML = data.players.map(p => `
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
          <span class="font-bold text-white truncate">${p.name}</span>
          ${p.isHost ? '<span class="text-[9px] bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded">Hôte</span>' : '✅'}
        </div>
      `).join('');
    }
  }

  function showLobbyUI(code, isHost) {
    document.getElementById('game-setup-view').classList.add('hidden');
    document.getElementById('game-lobby-view').classList.remove('hidden');
    document.getElementById('room-code-badge').classList.remove('hidden');
    document.getElementById('active-room-display').innerText = code;
    document.getElementById('lobby-code-display').innerText = code;

    if (isHost) {
      document.getElementById('host-start-btn').classList.remove('hidden');
      document.getElementById('host-start-btn').classList.add('flex');
      document.getElementById('student-waiting-notice').classList.add('hidden');
    } else {
      document.getElementById('host-start-btn').classList.add('hidden');
      document.getElementById('student-waiting-notice').classList.remove('hidden');
    }
  }
</script>
