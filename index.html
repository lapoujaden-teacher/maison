<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // Safe variable initialization
  const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'imposteur-house-game';
  let firebaseConfig = null;

  try {
    if (typeof window.__firebase_config !== 'undefined' && window.__firebase_config) {
      firebaseConfig = typeof window.__firebase_config === 'string' 
        ? JSON.parse(window.__firebase_config) 
        : window.__firebase_config;
    }
  } catch (e) {
    console.warn("Invalid Firebase configuration format, using local mode.");
  }

  let app = null;
  let auth = null;
  let db = null;
  let useLocalFallback = true;

  if (firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "demo-api-key") {
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      useLocalFallback = false;
    } catch(e) {
      console.warn("Firebase init failed, switching to local multi-tab mode:", e);
      useLocalFallback = true;
    }
  }

  let currentUser = { uid: 'user_' + Math.random().toString(36).substring(2, 9) };
  let roomUnsubscribe = null;

  const localChannel = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('imposteur_room_sync') : null;

  function getRoomDocRef(code) {
    if (useLocalFallback || !db) return null;
    return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', code.toString().toUpperCase());
  }

  async function initAuthentication() {
    if (useLocalFallback || !auth) {
      return currentUser;
    }
    try {
      if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
        const cred = await signInWithCustomToken(auth, window.__initial_auth_token);
        currentUser = cred.user;
      } else {
        const cred = await signInAnonymously(auth);
        currentUser = cred.user;
      }
    } catch (e) {
      console.warn("Auth initialization error, falling back to local session:", e);
      useLocalFallback = true;
    }
    return currentUser;
  }

  initAuthentication();

  function saveLocalRoomState(code, roomData) {
    try {
      localStorage.setItem(`imposteur_room_${code}`, JSON.stringify(roomData));
      if (localChannel) localChannel.postMessage({ type: 'ROOM_UPDATE', code, roomData });
    } catch(e) { 
      console.error("Local save error:", e); 
    }
  }

  function getLocalRoomState(code) {
    try {
      const data = localStorage.getItem(`imposteur_room_${code}`);
      return data ? JSON.parse(data) : null;
    } catch(e) { 
      return null; 
    }
  }

  // Bind to window explicitly for inline onclick handlers
  window.createNewOnlineRoom = async function() {
    try {
      await initAuthentication();

      const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
      gameState.roomCode = roomCode;
      gameState.isHost = true;
      gameState.myPlayerName = "Professeur (Hôte)";

      const countEl = document.getElementById('impostor-count-select');
      const impostorCount = countEl ? parseInt(countEl.value, 10) : 1;

      const roomData = {
        code: roomCode,
        status: 'LOBBY',
        hostId: currentUser.uid,
        topicCategory: gameState.topicCategory || 'rooms',
        impostorCount: impostorCount,
        players: [{
          id: currentUser.uid,
          name: gameState.myPlayerName,
          isHost: true,
          role: null
        }],
        secretRoom: null,
        secretActivity: null,
        selectedSuspectIndex: null,
        createdAt: Date.now()
      };

      if (!useLocalFallback && db) {
        try {
          await setDoc(getRoomDocRef(roomCode), roomData);
        } catch (err) {
          console.warn("Cloud connection unavailable, creating local room instead:", err);
          useLocalFallback = true;
        }
      }

      if (useLocalFallback) {
        saveLocalRoomState(roomCode, roomData);
      }

      listenToRoom(roomCode);
      showLobbyUI(roomCode, true);
    } catch (err) {
      console.error("Error creating room:", err);
    }
  };

  window.joinRoomByCode = async function() {
    await initAuthentication();
    const codeInput = document.getElementById('join-code-input').value.trim().toUpperCase();
    const nameInput = document.getElementById('join-name-input').value.trim();

    if (!codeInput || codeInput.length !== 4) {
      alert("Veuillez entrer un code à 4 chiffres valide.");
      return;
    }
    if (!nameInput) {
      alert("Veuillez entrer votre prénom.");
      return;
    }

    gameState.roomCode = codeInput;
    gameState.isHost = false;
    gameState.myPlayerName = nameInput;

    let roomData = null;

    if (!useLocalFallback && db) {
      try {
        const roomRef = getRoomDocRef(codeInput);
        const snap = await getDoc(roomRef);
        if (snap.exists()) {
          roomData = snap.data();
        }
      } catch (err) {
        console.warn("Cloud query failed, checking local storage:", err);
        useLocalFallback = true;
      }
    }

    if (!roomData) {
      roomData = getLocalRoomState(codeInput);
    }

    if (!roomData) {
      alert("Code de salle introuvable ! Vérifiez le code à 4 chiffres avec votre professeur.");
      return;
    }

    if (roomData.status !== 'LOBBY') {
      alert("La partie a déjà commencé dans cette salle.");
      return;
    }

    const updatedPlayers = roomData.players || [];
    if (!updatedPlayers.some(p => p.id === currentUser.uid)) {
      updatedPlayers.push({
        id: currentUser.uid,
        name: nameInput,
        isHost: false,
        role: null
      });
      roomData.players = updatedPlayers;

      if (!useLocalFallback && db) {
        try {
          await updateDoc(getRoomDocRef(codeInput), { players: updatedPlayers });
        } catch(e) {
          useLocalFallback = true;
          saveLocalRoomState(codeInput, roomData);
        }
      } else {
        saveLocalRoomState(codeInput, roomData);
      }
    }

    listenToRoom(codeInput);
    showLobbyUI(codeInput, false);
    syncGameStateFromFirebase(roomData);
  };

  function listenToRoom(code) {
    if (roomUnsubscribe) {
      roomUnsubscribe();
      roomUnsubscribe = null;
    }

    if (!useLocalFallback && db) {
      const roomRef = getRoomDocRef(code);
      try {
        roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
          if (!snapshot.exists()) return;
          const data = snapshot.data();
          syncGameStateFromFirebase(data);
        }, (error) => {
          console.warn("Room snapshot error, falling back to local listener:", error);
          useLocalFallback = true;
          listenLocalRoom(code);
        });
        return;
      } catch(e) {
        useLocalFallback = true;
      }
    }

    listenLocalRoom(code);
  }

  function listenLocalRoom(code) {
    const initialData = getLocalRoomState(code);
    if (initialData) syncGameStateFromFirebase(initialData);

    if (localChannel) {
      localChannel.onmessage = (event) => {
        if (event.data && event.data.code === code && event.data.roomData) {
          syncGameStateFromFirebase(event.data.roomData);
        }
      };
    }

    if (!window.localRoomInterval) {
      window.localRoomInterval = setInterval(() => {
        if (gameState.roomCode) {
          const latest = getLocalRoomState(gameState.roomCode);
          if (latest) syncGameStateFromFirebase(latest);
        }
      }, 1000);
    }
  }

  async function updateRoomState(updateObject) {
    const code = gameState.roomCode;
    if (!code) return;

    if (!useLocalFallback && db) {
      try {
        await updateDoc(getRoomDocRef(code), updateObject);
        return;
      } catch(e) {
        console.warn("Failed to update cloud, using local state update:", e);
        useLocalFallback = true;
      }
    }

    const localData = getLocalRoomState(code) || {};
    const updatedData = { ...localData, ...updateObject };
    saveLocalRoomState(code, updatedData);
    syncGameStateFromFirebase(updatedData);
  }

  function syncGameStateFromFirebase(data) {
    gameState.playerNames = (data.players || []).map(p => p.name);
    gameState.impostorCount = data.impostorCount || 1;

    const countEl = document.getElementById('lobby-player-count');
    if (countEl) countEl.innerText = data.players.length;

    const grid = document.getElementById('lobby-players-grid');
    if (grid) {
      grid.innerHTML = (data.players || []).map(p => `
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
          <span class="font-bold text-white truncate">${p.name}</span>
          ${p.isHost ? '<span class="text-[9px] bg-indigo-900 text-indigo-300 px-1.5 py-0.5 rounded">Hôte</span>' : '✅'}
        </div>
      `).join('');
    }

    if (data.status === 'REVEAL') {
      gameState.secretRoom = data.secretRoom;
      gameState.secretActivity = data.secretActivity;
      
      const me = (data.players || []).find(p => p.id === (currentUser ? currentUser.uid : ''));
      const isImpostor = me ? me.role === 'impostor' : false;

      document.getElementById('game-lobby-view').classList.add('hidden');
      document.getElementById('game-reveal-view').classList.remove('hidden');

      document.getElementById('reveal-player-name').innerText = gameState.myPlayerName;
      document.getElementById('card-back-player-title').innerText = gameState.myPlayerName;

      const roleBox = document.getElementById('role-display-content');
      if (isImpostor) {
        roleBox.innerHTML = `
          <div class="space-y-2">
            <span class="text-5xl">🕵️</span>
            <h4 class="text-2xl font-black text-red-500 tracking-wide">TU ES L'IMPOSTEUR !</h4>
            <p class="text-xs text-slate-300">
              Tu n'as pas le mot secret. Écoute les indices des autres élèves et fais semblant de connaître la pièce !
            </p>
          </div>
        `;
      } else {
        roleBox.innerHTML = `
          <div class="space-y-3">
            <span class="text-5xl">${gameState.secretRoom ? gameState.secretRoom.icon : '🏠'}</span>
            <div>
              <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider">Tu es Innocent • Ton Mot Secret :</span>
              <h4 class="text-2xl font-black text-white mt-1">${gameState.secretRoom ? gameState.secretRoom.name : 'La pièce'}</h4>
              <p class="text-xs text-indigo-300 mt-1">Activité : <span class="text-white font-semibold">${gameState.secretActivity || ''}</span></p>
            </div>
          </div>
        `;
      }
    } else if (data.status === 'DISCUSSION') {
      document.getElementById('game-reveal-view').classList.add('hidden');
      document.getElementById('game-discussion-view').classList.remove('hidden');
      renderDiscussionPlayers();
    } else if (data.status === 'VOTING') {
      document.getElementById('game-discussion-view').classList.add('hidden');
      document.getElementById('game-voting-view').classList.remove('hidden');
      renderOnlineVotingPlayers();
    } else if (data.status === 'RESULTS') {
      gameState.selectedSuspectIndex = data.selectedSuspectIndex;
      document.getElementById('game-voting-view').classList.add('hidden');
      document.getElementById('game-results-view').classList.remove('hidden');
      renderResultsView(data);
    }
  }

  window.startOnlineGameHost = async function() {
    if (!gameState.roomCode) return;
    
    let data = useLocalFallback ? getLocalRoomState(gameState.roomCode) : null;
    if (!data && db) {
      const snap = await getDoc(getRoomDocRef(gameState.roomCode));
      if (snap.exists()) data = snap.data();
    }
    if (!data) return;

    const players = data.players || [];
    if (players.length < 2) {
      alert("Il faut au moins 2 joueurs pour démarrer la partie !");
      return;
    }

    const randomRoom = ROOMS_DATA[Math.floor(Math.random() * ROOMS_DATA.length)];
    const randomActivity = randomRoom.activities[Math.floor(Math.random() * randomRoom.activities.length)];

    const playerIndices = Array.from({ length: players.length }, (_, i) => i);
    for (let i = playerIndices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [playerIndices[i], playerIndices[j]] = [playerIndices[j], playerIndices[i]];
    }
    const impostorIndices = playerIndices.slice(0, data.impostorCount || 1);

    const assignedPlayers = players.map((p, idx) => ({
      ...p,
      role: impostorIndices.includes(idx) ? 'impostor' : 'innocent'
    }));

    await updateRoomState({
      status: 'REVEAL',
      secretRoom: randomRoom,
      secretActivity: randomActivity,
      players: assignedPlayers
    });
  };

  window.proceedToDiscussion = async function() {
    if (gameState.roomCode) {
      await updateRoomState({ status: 'DISCUSSION' });
    } else {
      document.getElementById('game-reveal-view').classList.add('hidden');
      document.getElementById('game-discussion-view').classList.remove('hidden');
      renderDiscussionPlayers();
    }
  };

  window.goToVotingStage = async function() {
    if (gameState.roomCode) {
      await updateRoomState({ status: 'VOTING' });
    } else {
      document.getElementById('game-discussion-view').classList.add('hidden');
      document.getElementById('game-voting-view').classList.remove('hidden');
      renderOnlineVotingPlayers();
    }
  };

  function showLobbyUI(code, isHost) {
    document.getElementById('game-setup-view').classList.add('hidden');
    document.getElementById('game-lobby-view').classList.remove('hidden');

    document.getElementById('room-code-badge').classList.remove('hidden');
    document.getElementById('active-room-display').innerText = code;
    document.getElementById('lobby-code-display').innerText = code;

    if (isHost) {
      document.getElementById('host-start-btn').classList.remove('hidden');
      document.getElementById('host-start-btn').classList.add('flex');
      document.getElementById('student-waiting-notice').classList.add('hidden');
    } else {
      document.getElementById('host-start-btn').classList.add('hidden');
      document.getElementById('student-waiting-notice').classList.remove('hidden');
    }
  }
</script>
